services:
  postgres:
    image: postgres:16-alpine
    container_name: hireup-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hireup
      POSTGRES_PASSWORD: hireup
      POSTGRES_DB: hireup
    volumes:
      - hireup_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireup -d hireup"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hireup_pg_data:
